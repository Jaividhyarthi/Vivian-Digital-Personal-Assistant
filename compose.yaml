services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      VIVIAN_DB: /data/vivian.db
      VIVIAN_FILES: /data/files
    volumes: ["vivian-data:/data"]
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      VIVIAN_DB: /data/vivian.db
      VIVIAN_FILES: /data/files
    volumes: ["vivian-data:/data"]
    restart: unless-stopped
    depends_on: [api]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  vivian-data:
